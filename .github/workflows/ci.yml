name: mobile-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  android:
    name: Android, shared contracts, and specs
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Cache Gradle dependencies from pinned inputs
        uses: actions/cache@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties', 'contracts/platform-openapi.lock.json') }}

      - name: Install Android SDK platform
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Install pinned OpenSpec
        # This repository has no Node application, so adding a package manifest and lockfile solely
        # for one CLI would make the fleet gate require unrelated JavaScript lint configuration.
        # The executable input remains immutable through the exact package-version pin.
        run: npm install --global @fission-ai/openspec@1.10.0 # zizmor: ignore[adhoc-packages]

      - name: Repository bootstrap tests
        run: |
          ./tooling/tests/bootstrap_structure_test.sh
          ./tooling/tests/architecture_boundary_test.sh
          ./tooling/tests/gate_parity_test.sh
          ./tooling/tests/platform_library_contract_test.sh

      - name: Kotlin lint
        run: ./gradlew --no-daemon ktlintCheck

      - name: Generated contract drift
        run: ./tooling/contracts/check.sh

      - name: Contract mutation and generated-tree tests
        run: ./tooling/tests/contract_drift_test.sh

      - name: >-
          Shared Android tests including CaptureQueueIdempotencyTest, PlatformLibraryApiTest,
          LibraryListStoreTest, FixtureUserContentRepositoryTest, LibraryReaderStoreTest,
          ContentRouteTableTest, and Android build
        run: ./gradlew --no-daemon :shared:testDebugUnitTest :androidApp:assembleDebug

      - name: >-
          Android Keystore, AndroidCaptureQueuePersistenceTest, AndroidShareIntentParserTest,
          ShareStagingUiTest, CaptureSubmissionWorkerTest, OperationStatusUiTest,
          CaptureStatusNotificationTest, AndroidShareSmokeTest, LibraryDeepLinkIntentTest,
          and LibraryUiTest instrumentation
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: >-
            ./gradlew --no-daemon
            :shared:connectedDebugAndroidTest
            :androidApp:connectedDebugAndroidTest

      - name: Retain synthetic Android share test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-share-test-reports
          if-no-files-found: error
          path: |
            androidApp/build/reports/androidTests/connected/
            androidApp/build/outputs/androidTest-results/connected/

      - name: Strict OpenSpec validation
        run: |
          openspec validate --all --strict
          openspec validate --archived

  ios:
    name: iOS shared tests and shell build
    runs-on: macos-15
    timeout-minutes: 45
    env:
      # macos-15 defaults to Xcode 16.4, whose iOS SDK cannot link the UIKit symbols used by
      # Compose 1.11.1. Keep the toolchain explicit while retaining the iOS 18.5 deployment floor.
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle and Kotlin/Native dependencies from pinned inputs
        uses: actions/cache@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.konan
          key: apple-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties', 'contracts/platform-openapi.lock.json') }}

      - name: Swift format and lint
        run: swift format lint --recursive --strict iosApp

      - name: iOS Share entitlements and embedded target structure
        run: ./tooling/tests/ios_share_entitlements_test.sh

      - name: Shared iOS tests including IosCaptureQueuePersistenceTest and framework
        run: ./gradlew --no-daemon :shared:iosSimulatorArm64Test :shared:linkDebugFrameworkIosSimulatorArm64

      - name: >-
          ShareExtensionParserTests, AppGroupEnvelopeTests, AppGroupInboxImporterTests,
          IosKeychainCredentialStorageTests, IosSubmissionSchedulerTests,
          IosSubmissionStatusFlowTests, IosShareSmokeTests, and IosLibraryRoutingTests
        run: |
          simulator_id="$(xcrun simctl list devices available --json | jq -er '[.devices[][] | select(.isAvailable and (.name | startswith("iPhone")))][0].udid')"
          xcodebuild -quiet -project iosApp/Ratatoskr.xcodeproj -scheme Ratatoskr -sdk iphonesimulator -destination "platform=iOS Simulator,id=$simulator_id" -resultBundlePath build/ios-share-test-results.xcresult test

      - name: Inspect effective app and RatatoskrShare.appex simulator entitlements
        run: |
          app_xcent="$(find ~/Library/Developer/Xcode/DerivedData -path '*Ratatoskr.build/Debug-iphonesimulator/Ratatoskr.build/Ratatoskr.app-Simulated.xcent' -print -quit)"
          extension_xcent="$(find ~/Library/Developer/Xcode/DerivedData -path '*Ratatoskr.build/Debug-iphonesimulator/RatatoskrShare.build/RatatoskrShare.appex-Simulated.xcent' -print -quit)"
          test -n "$app_xcent" && test -n "$extension_xcent"
          /usr/libexec/PlistBuddy -c 'Print :com.apple.security.application-groups:0' "$app_xcent" | grep -Fx group.com.ratatoskr.mobile
          /usr/libexec/PlistBuddy -c 'Print :com.apple.security.application-groups:0' "$extension_xcent" | grep -Fx group.com.ratatoskr.mobile
          /usr/libexec/PlistBuddy -c 'Print :keychain-access-groups:0' "$app_xcent" | grep -E '^[^.]+\.com\.ratatoskr\.mobile\.shared$'
          /usr/libexec/PlistBuddy -c 'Print :keychain-access-groups:0' "$extension_xcent" | grep -E '^[^.]+\.com\.ratatoskr\.mobile\.shared$'

      - name: Retain synthetic iOS share test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-share-test-results
          if-no-files-found: error
          path: build/ios-share-test-results.xcresult

      - name: Unsigned iOS Simulator app with embedded RatatoskrShare.appex
        run: xcodebuild -project iosApp/Ratatoskr.xcodeproj -scheme Ratatoskr -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
